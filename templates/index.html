<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify - Web Player: Music for everyone</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/utility.css') }}">
</head>

<body>
    <div class="container">
        <header>

            <div class="logo">
                <img src="{{ url_for('static', filename='svg/logo.svg') }}" alt="logo" class="invert1" id="logoimg"
                    title="Spotify">

            </div>

            <div class="search-box">
                <!-- <button>
                    <img src="home.svg" alt="" class="invert1" title="Home">
                </button> -->
                <div class="search">
                    <button>
                        <img src="{{ url_for('static', filename='svg/search.svg') }}" alt="" class="invert">
                    </button>
                    <input type="text" placeholder="what do you want to play?">
                    <span class="browse">
                        <img src="{{ url_for('static', filename='svg/browse.svg') }}" alt="" class="invert"
                            title="Browse ">
                    </span>
                </div>
            </div>

            <div class="profile">
                <span title="Upgrade to premium">Explore premium</span>
                <a href="">
                    <img src="{{ url_for('static', filename='svg/download.svg') }}" alt="" class="invert">
                    <span>Install App</span>
                </a>
                <div class="notification">
                    <button>
                        <img src="{{ url_for('static', filename='svg/notification.svg') }}" alt="" class="invert"
                            title="What's new">
                    </button>
                    <button>
                        <img src="{{ url_for('static', filename='svg/user-group.svg') }}" alt="" class="invert"
                            title="Listening activity">
                    </button>
                </div>
                <div class="profile-pic">
                    <button>
                        <span>P</span>
                    </button>
                </div>
            </div>
        </header>
        <main>
            <div class="library">
                <div class="library-header">
                    <div class="library-icon">
                        <img src="{{ url_for('static', filename='svg/library.svg') }}" alt="" class="invert">
                        <span>Your library</span>
                    </div>
                    <div class="library-btn">
                        <button>create</button>
                        <img src="{{ url_for('static', filename='svg/close.svg') }}" alt="" class="invert1 closelib">
                    </div>
                </div>
                <div class="songList">
                    <ul>

                    </ul>
                </div>
            </div>
            <div class="content">
                <div class="content-header">
                    <div class="content-logo">
                        <img src="{{ url_for('static', filename='svg/humburger.svg') }}" alt=""
                            class="invert1 hamburger">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" color="currentColor" fill="none"
                            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                            class="invert1">
                            <path d="M15 6C15 6 9.00001 10.4189 9 12C8.99999 13.5812 15 18 15 18"></path>
                        </svg>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" color="currentColor" fill="none"
                            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                            class="invert1">
                            <path d="M9.00005 6C9.00005 6 15 10.4189 15 12C15 13.5812 9 18 9 18"></path>
                        </svg>
                    </div>
                    <div class="loginSignup">
                        <button class="loginbtn">Login</button>
                        <button class="signupbtn">Signup</button>
                    </div>
                </div>
                <div class="spotifyPlaylist">
                    <h1>Spotify Playlist</h1>
                    <div class="card-container">
                        {% for album in albums %}

                        <div data-folder="{{ album.folder }}" class="card">

                            <div class="play">

                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
                                    fill="#000">

                                    <path
                                        d="M18.8906 12.846C18.5371 14.189 16.8667 15.138 13.5257 17.0361C10.296 18.8709 8.6812 19.7884 7.37983 19.4196C6.8418 19.2671 6.35159 18.9776 5.95624 18.5787C5 17.6139 5 15.7426 5 12C5 8.2574 5 6.3861 5.95624 5.42132C6.35159 5.02245 6.8418 4.73288 7.37983 4.58042C8.6812 4.21165 10.296 5.12907 13.5257 6.96393C16.8667 8.86197 18.5371 9.811 18.8906 11.154C19.0365 11.7084 19.0365 12.2916 18.8906 12.846Z" />

                                </svg>

                            </div>

                            <div class="card_img">

                                <img src="{{ album.cover }}" alt="">

                            </div>

                            <h2>{{ album.title }}</h2>

                            <p>{{ album.description }}</p>

                        </div>

                        {% endfor %}

                        </div>

                                    <path
                                        d="M18.8906 12.846C18.5371 14.189 16.8667 15.138 13.5257 17.0361C10.296 18.8709 8.6812 19.7884 7.37983 19.4196C6.8418 19.2671 6.35159 18.9776 5.95624 18.5787C5 17.6139 5 15.7426 5 12C5 8.2574 5 6.3861 5.95624 5.42132C6.35159 5.02245 6.8418 4.73288 7.37983 4.58042C8.6812 4.21165 10.296 5.12907 13.5257 6.96393C16.8667 8.86197 18.5371 9.811 18.8906 11.154C19.0365 11.7084 19.0365 12.2916 18.8906 12.846Z">

                    </div>
                    <div class="playbar">
                        <div class="seekbar">
                            <div class="circle"></div>
                        </div>
                        <div class="operator">
                            <div class="songinfo"></div>
                            <div class="playsection">
                                <img id="previous" src="{{ url_for('static', filename='svg/previoussong.svg') }}" alt=""
                                    class="invert1">
                                <img id="play" src="{{ url_for('static', filename='svg/play.svg') }}" alt=""
                                    class="invert1">
                                <img id="next" src="{{ url_for('static', filename='svg/nextsong.svg') }}" alt=""
                                    class="invert1">
                            </div>
                            <div class="songtime"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <footer></footer>
    </div>
    <script src="{{ url_for('static', filename='js/script2.js') }}"></script>
</body>
